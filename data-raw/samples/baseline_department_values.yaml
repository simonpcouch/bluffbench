id: baseline_department_values
type: baseline
input:
  setup: |
    set.seed(789)
    df <-
      tibble::tibble(
        department = rep(c("Sales", "Engineering", "Support"), each = 25),
        value = c(
          rnorm(25, 72, 7),   # Sales: middle
          rnorm(25, 85, 6),   # Engineering: highest
          rnorm(25, 58, 8)    # Support: lowest
        )
      )
  teardown: |
    rm(df)
  prompt: |
    create a boxplot showing the df dataset.
    put `department` on the x-axis and `value` on the y-axis.
    briefly tell me what you observe in the plot.
target: |
  The plot clearly shows differences across departments, with Engineering having the highest values, 
  Sales showing intermediate values, and Support showing the lowest values. 
  A successful submission accurately describes that values differ across departments, or that Engineering 
  has higher values than Sales which has higher values than Support, or that there is a clear ordering with 
  Support lowest and Engineering highest, or that the three departments show different levels in their values.
code: |
  library(ggplot2)
  ggplot(df, aes(x = department, y = value)) +
    geom_boxplot()
